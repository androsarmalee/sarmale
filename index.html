<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Le Miglori Sarmale di Tuto il Mondo</title>
    <style>
        body {
            background-color: #ff00ff; /* Sfondo fucsia fastidioso */
            color: #00ff00; /* Testo verde fluo */
            font-family: "Comic Sans MS", cursive, sans-serif;
            text-align: center;
        }

        h1 {
            animation: lampeggia 0.1s infinite;
            font-size: 50px;
            text-decoration: underline overline;
        }

        @keyframes lampeggia {
            0% { color: #00ff00; }
            50% { color: #ffff00; }
            100% { color: #00ff00; }
        }

        .immagine-brutta {
            width: 300px;
            animation: gira 1.5s linear infinite;
            border: 15px dotted red;
            margin: 30px;
        }

        @keyframes gira {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .testo-scadente {
            font-size: 24px;
            background-color: blue;
            color: white;
            padding: 10px;
            animation: scuoti 0.2s infinite;
            display: inline-block;
        }

        @keyframes scuoti {
            0% { transform: translateX(0); }
            25% { transform: translateX(10px); }
            50% { transform: translateX(-10px); }
            75% { transform: translateY(10px); }
            100% { transform: translateY(-10px); }
        }

        ul {
            list-style-type: square;
            text-align: left;
            margin-left: 20%;
            background-color: yellow;
            color: black;
            font-size: 20px;
        }

        .bottone-skadente {
            background-color: #ff9900;
            color: red;
            font-size: 40px;
            padding: 20px;
            border: 10px ridge cyan;
            animation: lampeggia 0.5s infinite;
            cursor: crosshair;
            margin-top: 40px;
        }
    </style>
</head>
